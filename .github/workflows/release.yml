name: Release

# 推送 v*.*.* 形式的 tag 时触发，例如：
#   git tag v0.0.3 && git push origin v0.0.3
on:
  push:
    tags:
      - 'v*.*.*'

# gh release create / edit / upload 需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 .vsix
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 防止 tag 与 package.json 版本不一致，导致产出的 .vsix 文件名对不上 tag
      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag = $tag"
          echo "package.json = $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 中的版本 $pkg 不一致。请先把 package.json 的 version 改为 $tag，再重新打 tag。"
            exit 1
          fi

      # vsce package 会先跑 vscode:prepublish（即 npm run compile），这里显式再跑一次只是为了失败点更清晰
      - name: 编译
        run: npm run compile

      # @vscode/vsce 已锁定在 devDependencies，用 npm script 走同一份版本，避免每次联网拉取
      - name: 打包 .vsix
        run: npm run package

      # Release 说明直接取 CHANGELOG.md 中该版本的条目，保证两处不会各说各话。
      # 用 index() 做字面匹配，避免把版本号里的 . 当成正则通配符。
      - name: 从 CHANGELOG.md 提取本版本说明
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { hit = 1; next }
            index($0, "## [") == 1        { hit = 0 }
            hit                           { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            echo "已从 CHANGELOG.md 提取 $ver 的说明："
            cat RELEASE_NOTES.md
          else
            rm -f RELEASE_NOTES.md
            echo "::warning::CHANGELOG.md 中没有 $ver 的条目，本次将使用链接到 CHANGELOG 的占位说明。"
          fi

      # 首次创建 Release；若已存在（例如重推 tag、重跑工作流）则更新说明并覆盖附件，
      # 而不是失败退出——这样修 CHANGELOG 之后重推 tag 就能把说明补上。
      - name: 创建 / 更新 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            notes=(--notes-file RELEASE_NOTES.md)
          else
            notes=(--notes "详见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)")
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，更新说明与附件。"
            gh release edit "$GITHUB_REF_NAME" "${notes[@]}"
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            echo "创建 Release $GITHUB_REF_NAME。"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              "${notes[@]}" \
              ./*.vsix
          fi
